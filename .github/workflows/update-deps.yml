name: Update upstream dependencies

# Two upstreams now, not one. The deploy contract (runtime/deploy and
# adaptersdk) moved out of PromptKit into promptarena, so a release there
# reaches this adapter only if we listen for it — which nothing did, leaving the
# module that defines the adapter's own interface with no update path at all.
on:
  repository_dispatch:
    types: [promptkit-release, promptarena-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update PromptKit to ${{ github.event.client_payload.version }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Check out with the PAT so the branch push below is attributed to it
        # rather than to GITHUB_TOKEN — see the note on "Create pull request".
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'

    - name: Update go.mod
      env:
        VERSION: ${{ github.event.client_payload.version }}
        # Read from the environment rather than interpolated into the script:
        # a dispatch payload is attacker-controlled input to a shell otherwise.
        EVENT: ${{ github.event.action }}
      run: |
        if [ "$EVENT" = "promptarena-release" ]; then
          echo "Updating promptarena to $VERSION..."
          go mod edit -require="github.com/AltairaLabs/promptarena@$VERSION"
          go mod edit -dropreplace="github.com/AltairaLabs/promptarena"
        else
          echo "Updating PromptKit modules to $VERSION..."

          # Bump every PromptKit module this repo may reference. `go mod tidy`
          # below drops any that turn out to be unused.
          for m in runtime pkg sdk; do
            go mod edit -require="github.com/AltairaLabs/PromptKit/$m@$VERSION"
            go mod edit -dropreplace="github.com/AltairaLabs/PromptKit/$m"
          done
        fi

        go mod tidy

        echo "✓ Updated go.mod"

    - name: Verify build
      run: |
        echo "Verifying build without replace directives..."
        go build -o promptarena-deploy-foundry .
        go build -o foundry-runtime ./cmd/foundry-runtime/
        echo "✓ Build succeeded"

    - name: Verify tests
      run: |
        echo "Running tests..."
        go test ./... -v -race -count=1
        echo "✓ Tests passed"

    # The PAT is required, not a preference. GitHub deliberately does not start
    # workflow runs for events raised by GITHUB_TOKEN (a recursion guard), so a
    # PR opened with it never gets CI, its required checks never report, and it
    # sits mergeable-but-BLOCKED forever. Opening the PR as a real user makes
    # CI run normally.
    - name: Create pull request
      env:
        VERSION: ${{ github.event.client_payload.version }}
        EVENT: ${{ github.event.action }}
        GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        if [ "$EVENT" = "promptarena-release" ]; then
          UPSTREAM="promptarena"
        else
          UPSTREAM="PromptKit"
        fi
        BRANCH="deps/$UPSTREAM-$VERSION"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git checkout -b "$BRANCH"
        git add -A
        git commit -s -m "deps: update $UPSTREAM to $VERSION

        Drop replace directives — published modules are now available on
        the Go proxy."

        git push origin "$BRANCH"

        # Unquoted delimiter, so $VERSION interpolates. With <<'PREOF' the body
        # would render the literal string "$VERSION".
        gh pr create \
          --title "deps: update $UPSTREAM to $VERSION" \
          --body "$(cat <<PREOF
        ## Summary

        - Update \`$UPSTREAM\` to $VERSION
        - Drop \`replace\` directives from \`go.mod\` (published modules available)

        Triggered automatically by the $UPSTREAM release of $VERSION.

        ## Verification

        - [x] \`go build\` passes for both the adapter and the runtime
        - [x] \`go test ./... -race\` passes

        🤖 Generated automatically by the update-deps workflow
        PREOF
        )"

        echo "✓ Created PR for $BRANCH"
