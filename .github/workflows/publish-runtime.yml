name: Publish runtime image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only — Foundry rejects arm64 images. Operators mirror this
      # image into their own Azure Container Registry, which is where hosted
      # agents must pull from.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ghcr.io/altairalabs/promptkit-foundry-runtime:${{ steps.meta.outputs.tag }}
            ghcr.io/altairalabs/promptkit-foundry-runtime:latest
          # SBOM and SLSA provenance attached to the pushed image as OCI
          # referrers via buildx, with no Sigstore involvement. Inspect with:
          #   docker buildx imagetools inspect <ref> --format '{{json .SBOM}}'
          #
          # Omnia took the same route deliberately: the GitHub attestation
          # store (attest-build-provenance + attest-sbom) pushes to Sigstore's
          # public Rekor log, whose timeouts failed its push job routinely, and
          # the attestations never surfaced in the UI in a way anyone used.
          # On-image provenance still satisfies SLSA L2 for consumers who
          # inspect with buildx.
          provenance: true
          sbom: true

