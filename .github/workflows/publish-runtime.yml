name: Publish runtime image

# Called by release.yml after GoReleaser succeeds, so a tag push builds the
# image. It does not listen for `release: published`: GoReleaser publishes the
# release with GITHUB_TOKEN (`draft: false`), and GitHub starts no workflow from
# an event that token caused, so that trigger never fired after v0.2.0.
#
# Dispatch it by hand to rebuild or backfill a tag. It checks out the tag it is
# given, so the branch it is dispatched from does not matter.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.2.3
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.2.3
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/altairalabs/promptkit-foundry-runtime

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a vX.Y.Z release tag"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      # :latest moves only when this tag is the newest stable release, so a
      # rebuild or backfill of an older tag cannot pull it backwards, and a
      # prerelease never takes it.
      - name: Resolve image tags
        id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          newest=$(git ls-remote --tags origin 'v*' \
            | sed -e 's#.*refs/tags/##' -e 's#\^{}$##' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -uV | tail -n 1)
          if [ -z "$newest" ]; then
            echo "::error::could not list stable v* tags from origin"
            exit 1
          fi
          echo "tag=$TAG newest=$newest"
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$TAG"
            if [ "$TAG" = "$newest" ]; then echo "$IMAGE:latest"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only — Foundry rejects arm64 images. Operators mirror this
      # image into their own Azure Container Registry, which is where hosted
      # agents must pull from.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ inputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          # SBOM and SLSA provenance attached to the pushed image as OCI
          # referrers via buildx, with no Sigstore involvement. Inspect with:
          #   docker buildx imagetools inspect <ref> --format '{{json .SBOM}}'
          #
          # Omnia took the same route deliberately: the GitHub attestation
          # store (attest-build-provenance + attest-sbom) pushes to Sigstore's
          # public Rekor log, whose timeouts failed its push job routinely, and
          # the attestations never surfaced in the UI in a way anyone used.
          # On-image provenance still satisfies SLSA L2 for consumers who
          # inspect with buildx.
          provenance: true
          sbom: true
