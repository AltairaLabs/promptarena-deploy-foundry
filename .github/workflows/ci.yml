name: CI

on:
  push:
    branches: [main]
  # No branches filter: stacked pull requests target another feature branch
  # rather than main, and a `branches: [main]` filter silently skips them —
  # leaving those PRs with no CI signal at all.
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26.0'

    - name: Build adapter
      run: GOWORK=off go build -o promptarena-deploy-foundry .

    - name: Build runtime
      run: GOWORK=off go build -o foundry-runtime ./cmd/foundry-runtime/

    - name: Test with race detector and coverage
      run: GOWORK=off go test ./... -v -race -count=1 -coverprofile=coverage.out

    - name: Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage
        path: coverage.out
        retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26.0'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
      with:
        version: v2.12.2
      env:
        GOWORK: "off"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    # The Dockerfile pins linux/amd64; this is the same build the release
    # publishes, so a broken Dockerfile fails the PR rather than the release.
    - name: Build runtime image
      run: docker build -t promptkit-foundry-runtime:ci .

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test
    if: github.actor != 'dependabot[bot]'

    steps:
    - name: Check for SONAR_TOKEN
      id: guard
      run: |
        if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
          echo "SONAR_TOKEN is not set; skipping the SonarCloud scan." >&2
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout code
      if: steps.guard.outputs.enabled == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - name: Download coverage artifact
      if: steps.guard.outputs.enabled == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage

    - name: SonarCloud Scan
      if: steps.guard.outputs.enabled == 'true'
      uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
      with:
        # Block on the quality gate so this job fails (not silently passes)
        # when coverage/quality regresses.
        args: >
          -Dsonar.qualitygate.wait=true
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
