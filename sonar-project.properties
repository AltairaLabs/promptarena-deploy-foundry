sonar.projectKey=AltairaLabs_promptarena-deploy-foundry
sonar.organization=altairalabs

sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,test/integration/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

# Exclude only the process entry points from coverage. Everything they wire
# together (config, client, plan, apply, runtime handlers) is unit-tested and
# IS coverage-gated.
sonar.coverage.exclusions=**/main.go

sonar.sourceEncoding=UTF-8
